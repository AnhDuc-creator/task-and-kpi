[project]
name = "kpi-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "anthropic>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    # Chỉ dùng cho kịch bản e2e ở tests/e2e/. Bộ test pytest của backend không
    # chạm tới Playwright và vẫn chạy được khi chưa cài trình duyệt.
    # Cài trình duyệt bằng một lệnh riêng: `python -m playwright install chromium`.
    "playwright>=1.47",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
